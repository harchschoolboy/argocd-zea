# Declarative Connections. Zea admins can also create Connections in the UI;
# Secrets created this way (without the argocd-zea.io/managed-by: zea label)
# are read-only in the UI. Commit them through SealedSecrets, SOPS or External
# Secrets - never as plain Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: my-service-github
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: connection
type: Opaque
stringData:
  name: my-service
  provider: github
  url: https://github.com/org/my-service
  # Comma-separated Argo CD groups that may see and run it; "*" = everyone
  # who can open Zea.
  allowedGroups: devs,ops
  # GitHub App (recommended) ...
  githubAppID: "123456"
  githubAppInstallationID: "7890123"
  githubAppPrivateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    ...
    -----END RSA PRIVATE KEY-----
  # ... or a fine-grained token instead of the three keys above:
  # token: github_pat_...
  # Optional: container images built from this repository (see the README,
  # "Images"). "do" is the name of a Registry.
  images: |
    - registry: do
      repository: ^my-service-(?P<branch>.+)$
      tags: ^[0-9a-f]{7}$
---
apiVersion: v1
kind: Secret
metadata:
  name: billing-gitlab
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: connection
type: Opaque
stringData:
  name: billing
  provider: gitlab
  url: https://gitlab.example.com/payments/billing
  # Only needed when GitLab is served under a sub-path.
  # apiURL: https://example.com/gitlab/api/v4
  allowedGroups: payments
  # Project access token, role Developer, scope api.
  token: glpat-...
