# Values for the official argo-cd Helm chart (tested against chart 10.9.x /
# Argo CD v3.5). Merge into your existing values.
#
# Prerequisites:
#   1. The zea backend chart (deploy/helm/zea) is installed into the Argo CD
#      namespace with release name "zea" (otherwise adjust the service url).
#   2. The Secret "zea-proxy" exists in the Argo CD namespace. The Zea chart
#      creates it by default (proxyToken.source=generate).
#
# The UI is copied from the Zea backend image by an init container, so
# argocd-server needs no internet access; in air-gapped clusters mirror the
# image like any other. Keep its tag equal to the Zea chart version.
#
# After installing the Zea chart, "helm get notes zea -n argocd" (or the
# release notes) prints this snippet with your actual names filled in.

server:
  extensions:
    # Creates the "extensions" volume of argocd-server. Nothing is downloaded:
    # the Zea image copies its UI into the volume.
    enabled: true
    extensionList: []
  initContainers:
    - name: extension-zea
      image: ghcr.io/harchschoolboy/argocd-zea-backend:0.6.0
      args: [install-ui, /tmp/extensions]
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: extensions
          mountPath: /tmp/extensions

configs:
  params:
    server.enable.proxy.extension: "true"

  cm:
    # Proxy: <argocd>/extensions/zea/* -> zea backend (prefix is stripped).
    extension.config.zea: |
      services:
        - url: http://zea.argocd.svc:8080
          headers:
            # Resolved by Argo CD from Secret "zea-proxy", key "token".
            - name: Zea-Proxy-Token
              value: '$zea-proxy:token'

  rbac:
    # Who may use Zea at all. Per-Application access is additionally enforced
    # by Argo CD: the user must be able to "get" the Application the request
    # is scoped to.
    policy.csv: |
      p, role:readonly, extensions, invoke, zea, allow
