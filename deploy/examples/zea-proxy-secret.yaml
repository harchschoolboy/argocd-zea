# Only needed with proxyToken.source=existing. By default the Zea chart
# generates this Secret in the cluster.
#
# Create it out of band, e.g.:
#
#   kubectl -n argocd create secret generic zea-proxy \
#     --from-literal=token="$(openssl rand -hex 32)"
#   kubectl -n argocd label secret zea-proxy app.kubernetes.io/part-of=argocd
#
# or commit it encrypted (SealedSecrets / SOPS / External Secrets).
# Never commit this file with a real token.
apiVersion: v1
kind: Secret
metadata:
  name: zea-proxy
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  token: REPLACE_WITH_RANDOM_TOKEN
