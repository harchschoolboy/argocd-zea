# Declarative Registries. Zea admins can also create Registries in the UI;
# Secrets created this way (without the argocd-zea.io/managed-by: zea label)
# are read-only in the UI. Commit them through SealedSecrets, SOPS or External
# Secrets - never as plain Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: registry-do
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: registry
type: Opaque
stringData:
  # Image sources of Connections refer to this name.
  name: do
  kind: digitalocean
  url: registry.digitalocean.com/my-registry
  # DigitalOcean API token with read access to the registry (registry:read).
  token: dop_v1_...
---
# A docker config Secret can be reused as a Registry: add the label and the
# name/kind/url keys. Here for a generic OCI registry (needs /v2/_catalog).
apiVersion: v1
kind: Secret
metadata:
  name: registry-harbor
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: registry
type: kubernetes.io/dockerconfigjson
stringData:
  name: harbor
  kind: oci
  # Only repositories below the namespace ("team") are listed.
  url: harbor.example.com/team
  .dockerconfigjson: |
    {"auths": {"harbor.example.com": {"username": "robot$zea", "password": "..."}}}
  # With type Opaque, username and password keys work instead:
  # username: robot$zea
  # password: ...
---
# Google Artifact Registry through Workload Identity Federation: Zea exchanges
# a token of its own service account (chart value registries.tokenRequest).
apiVersion: v1
kind: Secret
metadata:
  name: registry-gar-wif
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: registry
type: Opaque
stringData:
  name: gar-wif
  kind: gar
  url: europe-west1-docker.pkg.dev/my-project/my-repository
  workloadIdentityProvider: //iam.googleapis.com/projects/123456789/locations/global/workloadIdentityPools/k8s/providers/my-cluster
  # Optional; without it the federated principal itself needs access.
  impersonateServiceAccount: zea-reader@my-project.iam.gserviceaccount.com
---
# Google Artifact Registry with the pod's identity (GKE Workload Identity or
# the chart's gcp.workloadIdentityFederation): no credential keys at all.
apiVersion: v1
kind: Secret
metadata:
  name: registry-gar
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: registry
type: Opaque
stringData:
  name: gar
  kind: gar
  url: europe-west1-docker.pkg.dev/my-project/my-repository
  # Or a service account key:
  # serviceAccountKey: |
  #   {"type": "service_account", ...}
---
# Reuse an existing image pull Secret by reference. It must be listed in the
# chart value registries.pullSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: registry-apps
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: registry
type: Opaque
stringData:
  name: apps
  kind: oci
  url: harbor.example.com/apps
  pullSecret: apps/regcred
