# Declarative Registries. Zea admins can also create Registries in the UI;
# Secrets created this way (without the argocd-zea.io/managed-by: zea label)
# are read-only in the UI. Commit them through SealedSecrets, SOPS or External
# Secrets - never as plain Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: registry-do
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: registry
type: Opaque
stringData:
  # Image sources of Connections refer to this name.
  name: do
  kind: digitalocean
  url: registry.digitalocean.com/my-registry
  # DigitalOcean API token with read access to the registry (registry:read).
  token: dop_v1_...
---
# A docker config Secret can be reused as a Registry: add the label and the
# name/kind/url keys. Here for a generic OCI registry (needs /v2/_catalog).
apiVersion: v1
kind: Secret
metadata:
  name: registry-harbor
  namespace: zea-connections
  labels:
    argocd-zea.io/secret-type: registry
type: kubernetes.io/dockerconfigjson
stringData:
  name: harbor
  kind: oci
  # Only repositories below the namespace ("team") are listed.
  url: harbor.example.com/team
  .dockerconfigjson: |
    {"auths": {"harbor.example.com": {"username": "robot$zea", "password": "..."}}}
  # With type Opaque, username and password keys work instead:
  # username: robot$zea
  # password: ...
