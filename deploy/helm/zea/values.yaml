# Zea backend MUST be installed into the Argo CD namespace: Argo CD can only
# resolve "$<secret>:<key>" references for Secrets in its own namespace that
# carry the label app.kubernetes.io/part-of=argocd.

replicaCount: 1

image:
  repository: ghcr.io/harchschoolboy/argocd-zea-backend
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Shared secret between Argo CD and the Zea backend. Argo CD injects it into
# every proxied request as the "Zea-Proxy-Token" header; the backend rejects
# requests without it, so the Argocd-* identity headers cannot be spoofed by
# workloads that reach the backend Service directly.
proxyToken:
  # Name of the Secret holding the token. Referenced from argocd-cm as
  # "$<secretName>:<key>".
  secretName: zea-proxy
  key: token
  # Where the Secret comes from:
  #   generate - (default) a pre-install/pre-upgrade hook Job (Argo CD PreSync
  #              hook) creates the Secret with a random token if it does not
  #              exist. An existing token is never replaced. The token never
  #              appears in git or in the rendered manifests.
  #   value    - the chart renders the Secret from "value" (use with an
  #              encrypted values file).
  #   existing - you create the Secret yourself (SealedSecrets, External
  #              Secrets, kubectl). It must carry the label
  #              app.kubernetes.io/part-of=argocd.
  source: generate
  value: ""
  # Settings for the "generate" hook Job.
  job:
    backoffLimit: 3
    activeDeadlineSeconds: 300
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

logLevel: info

# "<namespace>:<name>" of the anchor Application - normally the Argo CD
# Application that deploys this chart. Every Zea request is authorized by
# Argo CD against it ("applications, get"), so whoever can see the anchor
# Application can open Zea. The Application must carry the label
# argocd-zea.io/anchor: "true" so the UI can find it.
# Empty means "<release namespace>:<release name>", which matches an Argo CD
# Application deploying this chart into its own namespace (Argo CD uses the
# Application name as the Helm release name).
anchorApplication: ""

# Zea admins create, edit and delete Connections in the UI. Users are Argo CD
# usernames (local accounts such as "admin" have no groups); groups come from
# SSO. Everyone else only sees Connections whose allowedGroups match.
admins:
  users:
    - admin
  groups: []

# Connection Secrets live in a dedicated namespace so the backend never needs
# access to Secrets in the Argo CD namespace (Kubernetes RBAC cannot restrict
# list/create to labelled Secrets).
connections:
  namespace: zea-connections
  # Create the namespace with this chart. It is annotated so that neither
  # Helm nor Argo CD deletes it (and the Connections in it) on uninstall.
  createNamespace: true
  # Create a Role + RoleBinding granting the backend access to Secrets in
  # that namespace.
  rbac: true

# Timeout for calls to GitHub / GitLab APIs.
httpTimeout: 20s

# Registries can reuse existing image pull Secrets (authentication "Existing
# pull secret") instead of storing their own credentials. Only the Secrets
# listed here can be used: the chart grants "get" on exactly these names, in
# their namespaces. Zea reads them on every use, so rotation is picked up.
registries:
  pullSecrets: []
  # - namespace: apps
  #   name: regcred
  # Let Zea request tokens for its own service account (TokenRequest API,
  # "create serviceaccounts/token" on this one service account only). Needed
  # by the Artifact Registry authentication "Workload Identity Federation",
  # where every registry names its own provider and service account.
  tokenRequest: true

# Pod-wide Google identity for Artifact Registry (authentication "Pod
# identity"). Per-registry Workload Identity Federation needs none of this,
# only registries.tokenRequest.
# On GKE with Workload Identity, annotate the service account instead:
#   serviceAccount:
#     annotations:
#       iam.gke.io/gcp-service-account: zea@<project>.iam.gserviceaccount.com
# On other clusters, use Workload Identity Federation: Zea exchanges its
# Kubernetes service account token for a Google access token.
gcp:
  workloadIdentityFederation:
    enabled: false
    # Full provider name:
    # //iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
    audience: ""
    # Google service account to impersonate. Leave empty to grant roles to the
    # federated principal directly.
    serviceAccountEmail: ""
    # Audience of the projected Kubernetes token. Empty means "https:" plus
    # the provider name, the default allowed audience of a provider.
    tokenAudience: ""
    tokenExpirationSeconds: 3600

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
