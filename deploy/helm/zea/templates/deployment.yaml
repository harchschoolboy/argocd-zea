apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zea.fullname" . }}
  labels:
    {{- include "zea.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "zea.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "zea.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "zea.serviceAccountName" . }}
      # Needed to read and write Connection Secrets.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "zea.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ZEA_LISTEN_ADDR
              value: ":8080"
            - name: ZEA_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: ZEA_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxyToken.secretName }}
                  key: {{ .Values.proxyToken.key }}
            - name: ZEA_ANCHOR_APP
              value: {{ include "zea.anchorApplication" . | quote }}
            - name: ZEA_ADMIN_USERS
              value: {{ join "," .Values.admins.users | quote }}
            - name: ZEA_ADMIN_GROUPS
              value: {{ join "," .Values.admins.groups | quote }}
            - name: ZEA_CONNECTIONS_NAMESPACE
              value: {{ required "connections.namespace is required" .Values.connections.namespace | quote }}
            - name: ZEA_HTTP_TIMEOUT
              value: {{ .Values.httpTimeout | quote }}
            {{- if (.Values.registries | default dict).tokenRequest }}
            - name: ZEA_SERVICE_ACCOUNT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ZEA_SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            {{- end }}
            {{- with include "zea.pullSecretRefs" . }}
            - name: ZEA_REGISTRY_PULL_SECRETS
              value: {{ . | quote }}
            {{- end }}
            {{- if include "zea.gcpWIF" . }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/zea/gcp/credentials.json
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if include "zea.gcpWIF" . }}
          volumeMounts:
            - name: gcp
              mountPath: /var/run/secrets/zea/gcp
              readOnly: true
          {{- end }}
      {{- if include "zea.gcpWIF" . }}
      {{- $wif := .Values.gcp.workloadIdentityFederation }}
      volumes:
        - name: gcp
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $wif.tokenAudience | default (printf "https:%s" $wif.audience) | quote }}
                  expirationSeconds: {{ $wif.tokenExpirationSeconds | default 3600 }}
              - configMap:
                  name: {{ include "zea.fullname" . }}-gcp
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
