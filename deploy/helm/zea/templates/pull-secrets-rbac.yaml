{{- /* Read access to exactly the listed registry pull Secrets, one Role per namespace. */ -}}
{{- $byNs := dict }}
{{- range (.Values.registries | default dict).pullSecrets }}
{{- $ns := required "registries.pullSecrets[].namespace is required" .namespace }}
{{- $names := get $byNs $ns | default list }}
{{- $_ := set $byNs $ns (append $names (required "registries.pullSecrets[].name is required" .name) | uniq) }}
{{- end }}
{{- range $ns, $names := $byNs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "zea.fullname" $ }}-pull-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "zea.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $names | nindent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zea.fullname" $ }}-pull-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "zea.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "zea.fullname" $ }}-pull-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "zea.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
