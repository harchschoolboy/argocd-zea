{{- if (.Values.registries | default dict).tokenRequest }}
# Lets the backend request tokens for its own service account only, for
# registry Workload Identity Federation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "zea.fullname" . }}-token-request
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zea.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ include "zea.serviceAccountName" . | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zea.fullname" . }}-token-request
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zea.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "zea.fullname" . }}-token-request
subjects:
  - kind: ServiceAccount
    name: {{ include "zea.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}