{{- if eq (include "zea.proxyTokenSource" .) "value" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.proxyToken.secretName }}
  labels:
    {{- include "zea.labels" . | nindent 4 }}
    # Required so Argo CD can resolve "$<secret>:<key>" in extension.config.
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  {{ .Values.proxyToken.key }}: {{ required "proxyToken.value is required when proxyToken.source=value" .Values.proxyToken.value | quote }}
{{- end }}
