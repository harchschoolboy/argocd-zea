{{- if .Values.connections.rbac }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "zea.fullname" . }}-connections
  namespace: {{ .Values.connections.namespace }}
  labels:
    {{- include "zea.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zea.fullname" . }}-connections
  namespace: {{ .Values.connections.namespace }}
  labels:
    {{- include "zea.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "zea.fullname" . }}-connections
subjects:
  - kind: ServiceAccount
    name: {{ include "zea.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
